<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Стариков Анатолий - Элитная недвижимость</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: radial-gradient(circle at center, #2a2a2a 0%, #0f0f0f 100%);
            color: #f5f5f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .card {
            display: flex;
            flex-direction: row;
            background: rgba(30, 30, 30, 0.85);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(212, 175, 55, 0.25);
            border-radius: 24px;
            width: 100%;
            max-width: 780px;
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7);
            position: relative;
        }

        /* ===== НОВОЕ: Декоративные золотые линии в правом верхнем углу ===== */
        .corner-decoration {
            position: absolute;
            top: 28px;
            right: 28px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            z-index: 10;
        }

        .corner-decoration .line {
            height: 2px;
            background: linear-gradient(90deg, transparent, #D4AF37 30%, #F4D03F 100%);
            border-radius: 2px;
            box-shadow: 0 0 8px rgba(212, 175, 55, 0.4);
        }

        /* Три линии разной длины — эффект «лесенки» */
        .corner-decoration .line:nth-child(1) {
            width: 70px;
        }
        .corner-decoration .line:nth-child(2) {
            width: 50px;
        }
        .corner-decoration .line:nth-child(3) {
            width: 30px;
        }

        .photo-side {
            flex: 1;
            min-height: 420px;
            position: relative;
            overflow: hidden;
        }

        .photo-side img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center top;
            display: block;
            transition: transform 0.6s ease;
        }

        .card:hover .photo-side img {
            transform: scale(1.03);
        }

        .photo-side::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 40%;
            background: linear-gradient(to top, rgba(15, 15, 15, 0.9), transparent);
            pointer-events: none;
        }

        .content-side {
            flex: 1;
            padding: 40px 32px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .avatar-badge {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #D4AF37 0%, #AA8C2C 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: #121212;
            font-weight: bold;
            font-family: 'Playfair Display', serif;
            margin-bottom: 20px;
            box-shadow: 0 6px 18px rgba(212, 175, 55, 0.3);
        }

        .name {
            font-family: 'Playfair Display', serif;
            font-size: 26px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
            line-height: 1.2;
        }

        .title {
            font-size: 13px;
            font-weight: 500;
            color: #D4AF37;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        .divider {
            width: 40px;
            height: 2px;
            background: linear-gradient(90deg, #D4AF37, transparent);
            margin-bottom: 20px;
        }

        .info {
            font-size: 14px;
            color: #b0b0b0;
            margin-bottom: 28px;
            line-height: 1.7;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
        }

        .info-item i {
            color: #D4AF37;
            width: 16px;
            text-align: center;
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
            min-height: 48px;
        }

        .btn i {
            font-size: 16px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #D4AF37 0%, #B8942E 100%);
            color: #121212;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.5);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: #f5f5f5;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(212, 175, 55, 0.5);
            transform: translateY(-2px);
        }

        /* ===== АДАПТИВНОСТЬ ===== */
        @media (max-width: 720px) {
            .card {
                flex-direction: column;
                max-width: 420px;
            }

            .photo-side {
                min-height: 320px;
                max-height: 380px;
            }

            .content-side {
                padding: 32px 24px;
            }

            .name {
                font-size: 24px;
            }

            /* Скрываем декоративные линии на мобильных — они будут мешать */
            .corner-decoration {
                display: none;
            }
        }

        @media (max-width: 380px) {
            .photo-side {
                min-height: 280px;
            }
            .content-side {
                padding: 28px 20px;
            }
            .name {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>

    <main class="card">
        <!-- НОВОЕ: Декоративные золотые линии -->
        <div class="corner-decoration">
            <div class="line"></div>
            <div class="line"></div>
            <div class="line"></div>
        </div>

        <div class="photo-side">
            <img src="photo.jpg" alt="Стариков Анатолий Юрьевич">
        </div>

        <div class="content-side">
            <div class="avatar-badge">АС</div>
            <h1 class="name">Стариков Анатолий</h1>
            <p class="title">Элитная недвижимость</p>
            <div class="divider"></div>

            <div class="info">
                <div class="info-item">
                    <i class="fas fa-map-marker-alt"></i>
                    <span>Москва</span>
                </div>
                <div class="info-item">
                    <i class="fas fa-briefcase"></i>
                    <span>Индивидуальный подбор</span>
                </div>
                <div class="info-item">
                    <i class="fas fa-phone"></i>
                    <span>+7 (926) 155-27-77</span>
                </div>
            </div>

            <div class="actions">
                <a href="tel:+79261552777" class="btn btn-primary">
                    <i class="fas fa-phone"></i>
                    Позвонить
                </a>
                <a href="https://t.me/fes777" target="_blank" class="btn btn-secondary">
                    <i class="fab fa-telegram-plane"></i>
                    Telegram
                </a>
                <a href="mailto:contact@homexpert.ru" class="btn btn-secondary">
                    <i class="fas fa-envelope"></i>
                    Email
                </a>
            </div>
        </div>
    </main>

</body>
</html>
